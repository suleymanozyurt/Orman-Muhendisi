name: Orman Muhendisi Asistani - denetim

on:
  push:
    branches: [main]
    paths:
      - 'assistant-automation/**'
      - '.github/workflows/assistant-monitor.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orman-muhendisi-assistant-audit
  cancel-in-progress: false

jobs:
  quality-and-drive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_GOOGLE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kural ve dokuman kabul testleri
        run: node --test assistant-automation/monitor.test.mjs
      - name: Salt-okunur Drive yetkisi henüz tanımlanmadı
        if: env.HAS_GOOGLE_KEY != 'true'
        run: |
          echo '### Google Drive denetimi yapılandırılmadı' >> "$GITHUB_STEP_SUMMARY"
          echo 'Yalnız iki kanonik dosyaya Viewer erişimi olan Google hizmet hesabı GitHub Actions secret olarak tanımlanana kadar uzak Drive okuması yapılmaz.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bu sonuç Drive veya canlı eklenti sürümünün doğrulandığı anlamına gelmez.' >> "$GITHUB_STEP_SUMMARY"
      - name: Kanonik Docs ve Sheets salt-okunur sürüm denetimi
        if: env.HAS_GOOGLE_KEY == 'true'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: node assistant-automation/monitor.mjs
